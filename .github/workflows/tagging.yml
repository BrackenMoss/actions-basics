name: Bump version
on:
  push:
    branches: [main]

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@1.8.0 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}